<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Transcriber Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Custom animation for the recording pulse */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(2); opacity: 0; }
        }
        .recording-pulse::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: #ef4444;
            border-radius: 50%;
            z-index: -1;
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        /* Audio visualizer bars */
        .bar {
            width: 6px;
            background: #6366f1;
            border-radius: 9999px;
            transition: height 0.1s ease;
            height: 4px;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-sans selection:bg-indigo-100 selection:text-indigo-700">

<!-- Header -->
<header class="bg-white shadow-sm sticky top-0 z-10">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-2 rounded-lg">
                <i class="fas fa-microphone-lines text-xl"></i>
            </div>
            <h1 class="text-xl font-bold text-gray-900">Speech-to-Text Client</h1>
        </div>
        <button onclick="toggleSettings()" class="text-gray-500 hover:text-indigo-600 transition-colors">
            <i class="fas fa-cog text-xl"></i>
        </button>
    </div>
</header>

<!-- Settings Panel (Hidden by default) -->
<div id="settingsPanel" class="hidden max-w-4xl mx-auto px-4 py-4 bg-gray-100 border-b border-gray-200 transition-all">
    <label class="block text-sm font-medium text-gray-700 mb-1">API Endpoint URL</label>
    <div class="flex gap-2">
        <input type="text" id="apiUrl" value="http://18.206.238.39/api/v1/transcribe"
               class="flex-1 p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm font-mono"
               placeholder="http://localhost:8080/api/v1/transcribe">
        <button onclick="testConnection()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-md text-sm font-medium transition-colors">
            Test Connection
        </button>
    </div>
    <p id="connectionStatus" class="mt-2 text-xs text-gray-500"></p>
</div>

<!-- Main Content -->
<main class="max-w-2xl mx-auto px-4 py-12 flex flex-col items-center gap-8">

    <!-- Visualizer Area -->
    <div class="w-full h-32 bg-white rounded-2xl shadow-sm border border-gray-100 flex items-center justify-center overflow-hidden relative">
        <div id="visualizer" class="flex items-center justify-center gap-1 h-full w-full px-8 opacity-50">
            <!-- Bars generated by JS -->
            <span class="text-gray-400 text-sm">Ready to record...</span>
        </div>
    </div>

    <!-- Controls -->
    <div class="flex flex-col items-center gap-4">
        <div class="relative">
            <button id="recordBtn" onclick="toggleRecording()"
                    class="w-20 h-20 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white text-2xl shadow-lg shadow-indigo-200 transition-all transform hover:scale-105 active:scale-95 flex items-center justify-center z-10 relative">
                <i class="fas fa-microphone"></i>
            </button>
            <div id="pulseRing" class="hidden absolute top-0 left-0 w-20 h-20 rounded-full recording-pulse pointer-events-none"></div>
        </div>
        <p id="statusText" class="text-gray-500 font-medium">Tap to record</p>
        <p id="timer" class="text-gray-400 font-mono text-sm hidden">00:00</p>
    </div>

    <!-- Audio Preview (Hidden initially) -->
    <div id="audioPreview" class="w-full hidden animate-fade-in">
        <div class="flex items-center gap-4 bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
            <audio id="audioPlayer" controls class="w-full h-10"></audio>
            <button onclick="deleteRecording()" class="text-gray-400 hover:text-red-500 p-2 transition-colors" title="Discard">
                <i class="fas fa-trash"></i>
            </button>
        </div>
        <button onclick="uploadAudio()" id="transcribeBtn" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
            <i class="fas fa-wand-magic-sparkles"></i> Transcribe Audio
        </button>
    </div>

    <!-- Loading State -->
    <div id="loader" class="hidden flex-col items-center gap-3 mt-4">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
        <p class="text-indigo-600 font-medium text-sm">Transcribing audio...</p>
    </div>

    <!-- Result Area -->
    <div id="resultArea" class="w-full hidden">
        <div class="bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden">
            <div class="bg-gray-50 px-6 py-3 border-b border-gray-100 flex justify-between items-center">
                <h3 class="font-semibold text-gray-700">Transcript</h3>
                <div class="flex gap-2">
                    <span id="processingTime" class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full"></span>
                    <button onclick="copyText()" class="text-gray-400 hover:text-indigo-600 text-sm transition-colors">
                        <i class="fas fa-copy"></i>
                    </button>
                </div>
            </div>
            <div class="p-6">
                <p id="transcriptText" class="text-gray-800 leading-relaxed text-lg"></p>
            </div>
        </div>
    </div>

</main>

<script>
    // --- State Variables ---
    let mediaRecorder;
    let audioChunks = [];
    let audioBlob = null;
    let isRecording = false;
    let startTime;
    let timerInterval;
    let audioContext;
    let analyser;
    let dataArray;
    let visualizerFrame;

    // --- DOM Elements ---
    const recordBtn = document.getElementById('recordBtn');
    const pulseRing = document.getElementById('pulseRing');
    const statusText = document.getElementById('statusText');
    const timer = document.getElementById('timer');
    const visualizer = document.getElementById('visualizer');
    const audioPreview = document.getElementById('audioPreview');
    const audioPlayer = document.getElementById('audioPlayer');
    const transcribeBtn = document.getElementById('transcribeBtn');
    const resultArea = document.getElementById('resultArea');
    const loader = document.getElementById('loader');
    const settingsPanel = document.getElementById('settingsPanel');
    const apiUrlInput = document.getElementById('apiUrl');

    // --- Initialization ---
    function initVisualizer() {
        visualizer.innerHTML = '';
        for(let i=0; i<30; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = '4px';
            visualizer.appendChild(bar);
        }
    }
    initVisualizer();

    // --- Recording Logic ---
    async function toggleRecording() {
        if (!isRecording) {
            startRecording();
        } else {
            stopRecording();
        }
    }

    async function startRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                // Create blob with a container that is broadly supported,
                // the backend ffmpeg will handle conversion to wav
                const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/ogg';
                audioBlob = new Blob(audioChunks, { type: mimeType });
                const audioUrl = URL.createObjectURL(audioBlob);
                audioPlayer.src = audioUrl;

                // UI Updates
                audioPreview.classList.remove('hidden');
                resultArea.classList.add('hidden');
                stream.getTracks().forEach(track => track.stop()); // Stop mic
                cancelAnimationFrame(visualizerFrame);
                resetVisualizer();
            };

            mediaRecorder.start();

            // Set up Audio Context for Visualizer
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 64;
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            animateVisualizer();

            // UI Updates
            isRecording = true;
            recordBtn.innerHTML = '<i class="fas fa-stop"></i>';
            recordBtn.classList.replace('bg-indigo-600', 'bg-red-500');
            recordBtn.classList.replace('hover:bg-indigo-700', 'hover:bg-red-600');
            pulseRing.classList.remove('hidden');
            statusText.textContent = "Recording...";
            timer.classList.remove('hidden');
            audioPreview.classList.add('hidden');

            // Timer
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);

        } catch (err) {
            console.error("Error accessing microphone:", err);
            alert("Could not access microphone. Please ensure permissions are granted.");
        }
    }

    function stopRecording() {
        mediaRecorder.stop();
        isRecording = false;

        // UI Updates
        recordBtn.innerHTML = '<i class="fas fa-microphone"></i>';
        recordBtn.classList.replace('bg-red-500', 'bg-indigo-600');
        recordBtn.classList.replace('hover:bg-red-600', 'hover:bg-indigo-700');
        pulseRing.classList.add('hidden');
        statusText.textContent = "Tap to record";
        clearInterval(timerInterval);
        timer.classList.add('hidden');
        timer.textContent = "00:00";
    }

    function deleteRecording() {
        audioBlob = null;
        audioPlayer.src = '';
        audioPreview.classList.add('hidden');
        resultArea.classList.add('hidden');
        statusText.textContent = "Tap to record";
    }

    // --- API Interaction ---
    async function uploadAudio() {
        if (!audioBlob) return;

        const url = apiUrlInput.value.trim();
        if (!url) {
            alert("Please check API URL in settings");
            return;
        }

        // UI Loading State
        transcribeBtn.disabled = true;
        transcribeBtn.classList.add('opacity-50');
        loader.classList.remove('hidden');
        resultArea.classList.add('hidden');

        const formData = new FormData();
        // Use .wav extension hint, though content-type handles real mime
        formData.append("file", audioBlob, "recording.wav");

        try {
            const response = await fetch(url, {
                method: "POST",
                body: formData
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`Server Error: ${response.status} - ${errText}`);
            }

            const data = await response.json();

            // Success
            document.getElementById('transcriptText').textContent = data.transcript || "(No speech detected)";
            document.getElementById('processingTime').textContent = `${data.processingTimeMs}ms`;
            resultArea.classList.remove('hidden');

        } catch (error) {
            console.error("Upload failed", error);
            alert("Transcription failed: " + error.message);
        } finally {
            transcribeBtn.disabled = false;
            transcribeBtn.classList.remove('opacity-50');
            loader.classList.add('hidden');
        }
    }

    async function testConnection() {
        const baseUrl = apiUrlInput.value.trim().replace(/\/$/, ''); // remove trailing slash
        // Construct health endpoint based on convention
        const healthUrl = baseUrl + "/health";
        const statusEl = document.getElementById('connectionStatus');

        statusEl.textContent = "Testing...";
        statusEl.className = "mt-2 text-xs text-gray-500";

        try {
            const res = await fetch(healthUrl);
            if(res.ok) {
                const json = await res.json();
                statusEl.innerHTML = `<i class="fas fa-check-circle"></i> Connected! Status: ${json.status}`;
                statusEl.className = "mt-2 text-xs text-green-600 font-bold";
            } else {
                throw new Error(res.statusText);
            }
        } catch (e) {
            statusEl.innerHTML = `<i class="fas fa-times-circle"></i> Failed: ${e.message}`;
            statusEl.className = "mt-2 text-xs text-red-600 font-bold";
        }
    }

    // --- Utilities ---
    function updateTimer() {
        const diff = Math.floor((Date.now() - startTime) / 1000);
        const m = Math.floor(diff / 60).toString().padStart(2, '0');
        const s = (diff % 60).toString().padStart(2, '0');
        timer.textContent = `${m}:${s}`;
    }

    function toggleSettings() {
        settingsPanel.classList.toggle('hidden');
    }

    function copyText() {
        const text = document.getElementById('transcriptText').textContent;
        navigator.clipboard.writeText(text);
        alert("Transcript copied to clipboard!");
    }

    function animateVisualizer() {
        visualizerFrame = requestAnimationFrame(animateVisualizer);
        analyser.getByteFrequencyData(dataArray);

        const bars = document.querySelectorAll('.bar');
        // We only have 30 bars but FFT size is larger, step through data
        const step = Math.floor(dataArray.length / bars.length);

        bars.forEach((bar, index) => {
            const value = dataArray[index * step];
            const height = Math.max(4, (value / 255) * 100); // Scale to percentage
            bar.style.height = `${height}%`;
        });
    }

    function resetVisualizer() {
        document.querySelectorAll('.bar').forEach(bar => bar.style.height = '4px');
    }
</script>
</body>
</html>
