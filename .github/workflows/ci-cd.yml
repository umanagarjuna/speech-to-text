name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean install -B

      - name: Run tests
        run: mvn test -B

      - name: Generate test coverage
        run: mvn verify -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

  build-and-push-image:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Server
    needs: build-and-push-image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Ubuntu Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # 1. Setup SSH securely
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts
          
          # 2. Create directory on server
          ssh $SERVER_USER@$SERVER_HOST "mkdir -p ~/speech-to-text"
          
          # 3. Copy docker-compose file
          scp docker-compose.yml $SERVER_USER@$SERVER_HOST:~/speech-to-text/
          
          # 4. Execute remote deployment
          ssh $SERVER_USER@$SERVER_HOST << 'EOF'
            set -e 
          
            # --- INSTALLATION BLOCK ---
            if ! command -v docker &> /dev/null; then
                echo "Docker not found. Installing..."
                export DEBIAN_FRONTEND=noninteractive
                sudo apt-get update
                sudo apt-get install -y docker.io docker-compose-v2 < /dev/null
                sudo usermod -aG docker $USER
            fi

            # --- FIREWALL BLOCK ---
            # We disable UFW to ensure the OS firewall isn't blocking the connection.
            # We rely on AWS Security Groups for protection.
            echo "Disabling UFW to allow traffic..."
            sudo ufw disable || true
          
            cd ~/speech-to-text
          
            echo "Deploying application..."
          
            # Pull latest image
            sudo docker compose pull
          
            # --- PORT CLEARING BLOCK ---
            echo "Stopping old containers..."
            sudo docker compose down || true
          
            echo "Forcing release of port 80..."
            # Try using fuser first (cleaner)
            if command -v fuser &> /dev/null; then
                sudo fuser -k 80/tcp || true
            else
                # Fallback to lsof + kill
                sudo lsof -t -i:80 | xargs -r sudo kill -9 || true
            fi
          
            # Wait a moment for ports to actually close
            sleep 2
          
            # Restart containers
            sudo docker compose down || true
            sudo docker compose up -d
          
            # --- HEALTH CHECK BLOCK (INTERNAL) ---
            echo "Waiting for service to be healthy..."
            HEALTHY=false
          
            for i in {1..30}; do
              if curl -f http://localhost:80/api/v1/transcribe/health > /dev/null 2>&1 || \
                 curl -f http://localhost:8080/api/v1/transcribe/health > /dev/null 2>&1; then
                echo "Service is healthy!"
                HEALTHY=true
                break
              fi
              echo "Attempt $i: Service not ready yet..."
              sleep 2
            done
          
            if [ "$HEALTHY" = "false" ]; then
              echo "Service failed to start."
              sudo docker compose logs
              exit 1
            fi
          
            echo "Deployment Success."
          EOF

      - name: Print Public URL
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "✅ Deployment Successful!"
          echo "You can verify the service manually in your browser:"
          echo "👉 http://$SERVER_HOST:8080/api/v1/transcribe/health"

  notify:
    name: Notify Deployment Status
    needs: [test, build-and-push-image, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Deployment Success
        if: ${{ needs.deploy.result == 'success' }}
        run: echo "✅ Deployment completed successfully!"

      - name: Deployment Failed
        if: ${{ needs.deploy.result == 'failure' }}
        run: echo "❌ Deployment failed!" && exit 1