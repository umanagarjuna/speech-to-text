services:
  speech-to-text:
    image: ghcr.io/umanagarjuna/speech-to-text:latest
    container_name: speech-to-text
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - MODEL_PATH=/models/vosk-model-small-en-us-0.15
      - SAMPLE_RATE=16000
      - MAX_FILE_SIZE=100MB
      - MAX_REQUEST_SIZE=100MB
      - MAX_DURATION_SECONDS=600
      - TEMP_DIR=/tmp/transcriptions
      - LOG_FILE=/var/log/speech-to-text.log
      - JAVA_OPTS=-Xmx2g -Xms512m
    volumes:
      # Optional: Mount a local model directory to avoid downloading on each build
      # - ./models:/models:ro
      # Optional: Persist logs
      - ./logs:/var/log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/transcribe/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - speech-network

networks:
  speech-network:
    driver: bridge
